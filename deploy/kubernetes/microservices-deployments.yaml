apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
  namespace: litetrace
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ingestion-service
  template:
    metadata:
      labels:
        app: ingestion-service
    spec:
      containers:
        - name: ingestion
          image: litetrace/ingestion:latest
          env:
            - name: KAFKA_BROKERS
              value: "kafka.litetrace.svc.cluster.local:9092"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingestion-hpa
  namespace: litetrace
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ingestion-service
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processing-service
  namespace: litetrace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: processing-service
  template:
    metadata:
      labels:
        app: processing-service
    spec:
      containers:
        - name: processing
          image: litetrace/processing:latest
          env:
            - name: KAFKA_BROKERS
              value: "kafka.litetrace.svc.cluster.local:9092"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grouping-service
  namespace: litetrace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: grouping-service
  template:
    metadata:
      labels:
        app: grouping-service
    spec:
      containers:
        - name: grouping
          image: litetrace/grouping:latest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-service
  namespace: litetrace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: query-service
  template:
    metadata:
      labels:
        app: query-service
    spec:
      containers:
        - name: query
          image: litetrace/query:latest
          ports:
            - containerPort: 4000
