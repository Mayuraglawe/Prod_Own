    name: litetrace-worker
    env: node
    branch: Mayur
    buildCommand: npx pnpm@9.15.0 install && npx pnpm@9.15.0 --filter @litetrace/worker build
    startCommand: npx pnpm@9.15.0 --filter @litetrace/worker start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: TENANT_HEADER
        value: x-tenant-id
      - key: OTEL_SERVICE_NAME
        value: litetrace-worker

  # ── 4. Ingestion Service ──────────────────────────────────────────────────
