<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A flowchart showing how any page triggers a backend order creation, redirects to a dedicated payment page, goes through gateway checkout, then splits into a server-side webhook (source of truth) and a browser callback (UX only), both converging into an order-marked-paid final state.</desc>
