services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prodown
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prodown"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile=false && pnpm dev:api"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/prodown?schema=public
      REDIS_URL: redis://redis:6379
      APP_URL: http://localhost:3000
      TENANT_HEADER: x-tenant-id
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      N8N_ALERT_WEBHOOK_URL: ${N8N_ALERT_WEBHOOK_URL:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      OTEL_SERVICE_NAME: prod-own-api
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - ./:/app
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile=false && pnpm dev:worker"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/prodown?schema=public
      REDIS_URL: redis://redis:6379
      TENANT_HEADER: x-tenant-id
      OTEL_SERVICE_NAME: prod-own-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
